cases:
- id: reproduce-explicit
  part_id: B
  mode: explicit
  prompt: Use the reproduce skill on the bug in issue-42.md and tell me how you would reproduce it.
  expected: activates
  permitted_tools:
    claude-code:
    - Skill
    - Read
    codex:
    - command_execution
  fixtures:
    issue-42.md: '# Issue #42: Export crashes with empty date range

      Environment: macOS 15, app 2.3.1

      Steps: open Reports, clear both date fields, click Export.

      Expected: an empty CSV. Observed: the app quits.

      '
- id: reproduce-implicit
  part_id: B
  mode: implicit
  prompt: Can you repro the bug described in issue-42.md and check whether it is flaky?
  expected: activates
  permitted_tools:
    claude-code:
    - Skill
    - Read
    codex:
    - command_execution
  fixtures:
    issue-42.md: '# Issue #42: Export crashes with empty date range

      Environment: macOS 15, app 2.3.1

      Steps: open Reports, clear both date fields, click Export.

      Expected: an empty CSV. Observed: the app quits.

      '
- id: reproduce-near-miss
  part_id: B
  mode: negative
  prompt: Summarize in two sentences what issue-42.md is about; I do not need it reproduced.
  expected: does-not-activate
